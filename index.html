<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <title>Document</title>
</head>

<body>
    <main>
        <section class="header" id="header">
            <div class="img-1">
                <img src="image/img15.png" alt="" class="dish-1">
            </div>
            <div class="content-1">
                <div class="menu">
                    <img src="image/img24.png" alt="Логотип" class="logo">
                    <a class="menu-link" href="#header">Главное</a>
                    <a class="menu-link" href="#buy">Меню</a>
                    <a class="menu-link" href="#content-3">Записаться</a>
                    <img src="image/menu.png" alt="" class="burger-menu">
                </div>
                <div class="content-2">
                    <h1 class="content-title">Неделя <br> итальянской кухни</h1>
                    <p class="content-text">Мастер-класс по приготовлению блюд итальянской <br> кухни от мастер-шефа Марсело Моцарелло</p>
                    <a href="#content-3"></a><button class="content-button">Записаться</button>
                </div>
            </div>
            <div class="img">
                <img src="image/img23.png" alt="Блюдо" class="dish-2">
            </div>
        </section>
        <section class="buy" id="buy">
            <div>
                <h1 class="title-1">Что будем готовить</h1>
            </div>
            <div class="img-2">
                <img src="image/Group2.png" alt="">
                <img src="image/Group3.png" alt="">
                <img src="image/Group4.png" alt="">
                <img src="image/Group5.png" alt="">
                <img src="image/Group6.png" alt="">
                <img src="image/Group7.png" alt="">
            </div>
        </section>
        <section class="content-3" id="content-3">
           <div>
               <h1 class="title-2">Записаться <br> на мастер-класс</h1>
               <p class="text-2">Заполните форму заявки, и организатор <br> свяжется с вами в течение дня.</p>
               <img src="image/image22.png" alt="" class="pasta">
            </div>
            <div class="menu-2">
                <input type="text" name="name" id="name" placeholder="Имя">
                <input type="email" name="email" id="email" placeholder="Email">
                <input type="number" name="number" id="number" placeholder="Телефон">
                <button class="button-2">Оставить заявку</button>
            </div> 
        </section>
        <footer>
            <div class="footer">
                <img src="image/img24.png" alt="" class="logo-2">
                <p class="text-3">© 2023, Все права защищены</p>
                <a href="#header"><img src="image/up.png" alt="" class="up"></a>
            </div>
        </footer>
    </main>
</body>

</html>
